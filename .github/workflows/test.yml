name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Checkout contains tracked files, including any files accidentally force-added.
# The guard rejects private sample entries before tests run.

permissions:
  contents: read

jobs:
  regression-tests:
    name: Run regression suite (synthetic inputs only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracked files
        uses: actions/checkout@v4

      - name: Assert no private corpus leaked into repo
        run: node tools/prepare-pages.js --check

      - name: Run all regression tests (no install, no network)
        run: npm test
