name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracked files
        uses: actions/checkout@v4

      - name: Assert no private corpus leaked into repo
        run: node tools/prepare-pages.js --check

      - name: Run regression tests (Node, no install, no network)
        run: npm test

      - name: Stamp service-worker source version
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: node tools/inject-build-version.js

      - name: Prepare public Pages files
        id: pages_site
        run: |
          staging="$(mktemp -d "${RUNNER_TEMP}/cfb-pages.XXXXXX")"
          node tools/prepare-pages.js --output "$staging/site"
          echo "path=$staging/site" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages_site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
